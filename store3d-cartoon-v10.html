const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();

const modelURL='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb';let customers=[],template=null;let inventory=30,sales=0,queue=[],cash=5000,staff=false,restockTime=0;try{const d=JSON.parse(localStorage.getItem('store3d-v6')||'null');if(d){inventory=d.inventory;cash=d.cash;sales=d.sales;staff=d.staff}}catch(e){}function save(){try{localStorage.setItem('store3d-v6',JSON.stringify({inventory,cash,sales,staff}))}catch(e){}}function hud(t){msg.textContent=t+'｜現金 $'+cash+'｜庫存 '+inventory+'｜售出 '+sales+'｜隊伍 '+queue.length}function makeFallbackPerson(){const g=new THREE.Group();const skin=material(0xf3c69f),shirt=material([0x56a6dc,0xf19a7b,0x79ba92,0xb298dd][Math.floor(Math.random()*4)]),pants=material(0x3c5571),hair=material(0x59483e),shoes=material(0xffffff);function box(w,h,d,m,x,y,z,name){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);if(name)o.name=name;g.add(o);return o}function ball(r,m,x,y,z){const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),m);o.position.set(x,y,z);g.add(o);return o}

g.userData.limbs=[ll,rl,la,ra];return g}template=makeFallbackPerson();for(let i=0;i<3;i++)spawn();msg.textContent='顧客已進店（內建人物模型）';const loader=new GLTFLoader();loader.load(modelURL,gltf=>{if(!gltf.scene)return;msg.textContent='人物模型已載入；使用可動作內建角色'},undefined,e=>{msg.textContent='顧客已進店，使用內建人物模型'});function spawn(){if(!template||customers.length>=8)return;const person=template.clone(true);person.userData.limbs=['leftLeg','rightLeg','leftArm','rightArm'].map(n=>person.getObjectByName(n));person.position.set(0,0,15.8);scene.add(person);const shelf=Math.floor(Math.random()*3);customers.push({person,mode:'shop',target:new THREE.Vector3(-4+shelf*2.7,0,-1),wait:0,speed:1.3,walk:0,cart:null,shoppingTime:1.5})}function lineup(){queue.forEach((c,i)=>{c.target.set(4.5,0,2.4+i*1.3);if(c.mode==='pay'&&i>0)c.mode='queue'})}function pay(c){if(queue[0]!==c)return;queue.shift();if(c.cart&&inventory>0){inventory--;sales++;cash+=49;if(c.cart.parent)c.cart.parent.remove(c.cart);c.cart=null;hud('結帳成功')}else hud('缺貨離店');save();c.mode='exit';c.target.set(0,0,15.8);lineup()}document.getElementById('npc').onclick=spawn;document.getElementById('buy').onclick=()=>{if(cash<150)return hud('現金不足');cash-=150;inventory+=10;save();hud('進貨完成')};document.getElementById('hire').onclick=()=>{if(staff)return hud('已有補貨員');if(cash<1200)return hud('現金不足');cash-=1200;staff=true;save();hud('已雇用補貨員')};document.getElementById('save').onclick=()=>{save();hud('進度已儲存')};document.getElementById('reset').onclick=()=>{camera.position.set(13,14,17);orbit.target.set(0,.8,0);orbit.update()};document.getElementById('quality').onclick=()=>{renderer.setPixelRatio(1);sunlight.castShadow=false;renderer.shadowMap.enabled=false;msg.textContent='已切換低畫質，減少 iPhone 負擔'};function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;customers.slice().forEach(c=>{if(c.wait>0){c.wait-=dt;return}const p=c.person,dx=c.target.x-p.position.x,dz=c.target.z-p.position.z,d=Math.hypot(dx,dz);if(d>.15){const step=Math.min(d,dt*c.speed);p.position.x+=dx/d*step;p.position.z+=dz/d*step;p.rotation.y=Math.atan2(dx,dz);c.walk+=dt*9;const limbs=p.userData.limbs;if(Array.isArray(limbs)&&limbs.length===4&&limbs.every(l=>l&&l.rotation)){limbs[0].rotation.x=Math.sin(c.walk)*.45;limbs[1].rotation.x=-Math.sin(c.walk)*.45;limbs[2].rotation.x=-Math.sin(c.walk)*.38;limbs[3].rotation.x=Math.sin(c.walk)*.38;limbs[0].position.y=.43+Math.max(0,Math.sin(c.walk))*.05;limbs[1].position.y=.43+Math.max(0,-Math.sin(c.walk))*.05}}else if(c.mode==='shop'){if(c.shoppingTime>0){c.shoppingTime-=dt;p.rotation.y+=dt*.65;return}if(inventory>0){const item=new THREE.Mesh(new THREE.BoxGeometry(.2,.22,.16),new THREE.MeshStandardMaterial({color:0xe5c45d}));item.position.set(.4,1.05,.25);p.add(item);c.cart=item}c.mode='queue';queue.push(c);lineup();c.wait=2}else if(c.mode==='queue'&&queue[0]===c){c.mode='pay';c.wait=2;hud('正在收銀')}else if(c.mode==='pay'){pay(c)}else if(c.mode==='exit'){scene.remove(p);customers.splice(customers.indexOf(c),1)}});restockTime+=dt;if(staff&&inventory<6&&restockTime>7&&cash>=150){restockTime=0;cash-=150;inventory+=10;save();hud('員工自動補貨')}for(const w of walkers){w.g.position.x+=dt*w.speed;if(w.g.position.x>18)w.g.position.x=-18;if(w.g.position.x< -18)w.g.position.x=18}for(const t of traffic){t.car.position.x+=dt*t.speed;if(t.car.position.x>21)t.car.position.x=-21;if(t.car.position.x< -21)t.car.position.x=21}orbit.update();renderer.render(scene,camera)}requestAnimationFrame(loop);setInterval(spawn,6500);hud('3D 商店已啟動')}catch(e){error(e)}</script></body></html>
