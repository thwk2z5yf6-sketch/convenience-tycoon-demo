<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨｜NPC 經營 V6</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2a;color:white;font:15px system-ui}header{padding:13px 16px;background:#182b3a;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:19px}#stage{height:72vh;min-height:390px;position:relative;background:#a7c4d1}canvas{display:block;width:100%;height:100%;touch-action:none}#message{position:absolute;top:12px;left:12px;right:12px;max-width:480px;background:#102e42e8;padding:12px;border-radius:12px;line-height:1.6;pointer-events:none}#controls{padding:13px;display:flex;gap:8px;flex-wrap:wrap}button{background:#29bf9b;color:#052e26;border:0;padding:11px 16px;border-radius:10px;font-weight:bold}small{color:#a8bfc9}#fallback{display:none;padding:40px 20px;background:#e5f0f2;color:#284457;text-align:center}</style></head><body><header><h1>🏪 便利商店大亨 · 3D 場景預覽</h1><small>測試版</small></header><div id="stage"><div id="message">正在載入真正的 3D 場景與人物模型…</div><div id="fallback"><h2>3D 模型未能載入</h2><p>目前沒有啟動 3D 繪圖。請截圖這裡顯示的錯誤訊息。</p><p id="err"></p></div></div><div id="controls"><button id="reset">重設視角</button><button id="quality">降低畫質</button><button id="npc">新增顧客</button><button id="buy">進貨 10 件（$150）</button><button id="hire">雇用補貨員（$1200）</button><button id="save">儲存進度</button></div><p style="padding:0 14px"><small>這是獨立 3D 場景測試，不會覆蓋你原本的遊戲或存檔。用手指拖曳可旋轉視角，雙指縮放。設備為原創 3D 場景；人物模型採用公開範例資產，後續再換成正式授權的商店與角色模型。</small></p><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const stage=document.getElementById('stage'),msg=document.getElementById('message');function error(e){msg.textContent='⚠️ '+String(e?.message||e);document.getElementById('fallback').style.display='block';document.getElementById('err').textContent=String(e?.message||e)}window.addEventListener('unhandledrejection',e=>error(e.reason));window.addEventListener('error',e=>error(e.error||e.message));try{const scene=new THREE.Scene();scene.background=new THREE.Color(0xc5d7df);scene.fog=new THREE.Fog(0xc5d7df,26,55);const camera=new THREE.PerspectiveCamera(42,1,.1,120);camera.position.set(13,14,17);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;stage.insertBefore(renderer.domElement,msg);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.8,0);orbit.enableDamping=true;orbit.maxPolarAngle=1.5;orbit.minDistance=8;orbit.maxDistance=27;const ambient=new THREE.HemisphereLight(0xe8f6ff,0x84939c,2.2);scene.add(ambient);const sunlight=new THREE.DirectionalLight(0xfff8e8,2.7);sunlight.position.set(9,16,8);sunlight.castShadow=true;sunlight.shadow.mapSize.set(1024,1024);sunlight.shadow.camera.left=-14;sunlight.shadow.camera.right=14;sunlight.shadow.camera.top=14;sunlight.shadow.camera.bottom=-14;scene.add(sunlight);function material(color,metalness=0,roughness=.65,opacity=1){return new THREE.MeshStandardMaterial({color,metalness,roughness,transparent:opacity<1,opacity,side:THREE.DoubleSide})}const mats={floor:material(0xe6e4dd),wall:material(0xeef0ed),metal:material(0x8798a0,.7,.27),white:material(0xeef4f6,.1,.4),dark:material(0x334b57,.45,.35),glass:material(0xb7e8f4,.1,.15,.38),green:material(0x159f78),orange:material(0xefaa4e),wood:material(0x9b7860)};function cube(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cylinder(r1,r2,h,m,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}cube(15,.3,13,mats.floor,0,-.16,0);for(let x=-7;x<8;x++){cube(.012,.013,13,material(0xbac0bc),x,.006,0)}for(let z=-6;z<7;z++){cube(15,.013,.012,material(0xbac0bc),0,.007,z)}cube(15,3,.2,mats.wall,0,1.5,-6.5);cube(.2,3,13,mats.wall,-7.5,1.5,0);cube(.2,3,13,mats.wall,7.5,1.5,0);cube(15,.23,.28,mats.green,0,3.02,-6.5);cube(15,.11,.31,mats.orange,0,2.85,-6.5);for(let x=-5.5;x<=5.5;x+=2.8){cube(1.9,.08,.6,material(0xf4fbff,.1,.2),x,2.85,-2);let light=new THREE.PointLight(0xffffff,.45,7);light.position.set(x,2.7,-2);scene.add(light)}const shelves=[];for(let i=0;i<4;i++){let x=-5.1+i*2.65,z=-2.1;const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);shelves.push(group);for(let xx of [-.92,.92])for(let zz of [-.75,.75])cube(.07,1.65,.08,mats.metal,xx,.82,zz,group);for(let y of [.23,.68,1.13,1.58])cube(2,.07,1.7,mats.metal,0,y,0,group);for(let row=0;row<3;row++)for(let col=0;col<7;col++){let m=material([0x69a7c3,0xf3b565,0xcc7c77,0x88b58b][(col+i)%4],.05,.5);if(i===0){cylinder(.11,.11,.34,m,-.76+col*.25,.43+row*.45,-.34,group);cylinder(.11,.11,.34,m,-.76+col*.25,.43+row*.45,.28,group)}else{cube(.19,.29,.19,m,-.76+col*.25,.43+row*.45,-.34,group);cube(.19,.29,.19,m,-.76+col*.25,.43+row*.45,.28,group)}}}const fridge=new THREE.Group();fridge.position.set(5.5,0,-5.9);scene.add(fridge);cube(3.2,2.6,.9,mats.metal,0,1.3,0,fridge);cube(3,.25,.95,mats.dark,0,2.52,0,fridge);for(let i=0;i<3;i++){cube(.94,2.1,.045,mats.glass,-1.02+i*1.02,1.33,.49,fridge);cube(.035,1.9,.07,mats.white,-.6+i*1.02,1.32,.54,fridge);for(let j=0;j<4;j++)for(let k=0;k<3;k++)cylinder(.095,.095,.28,material([0x7ec0d2,0x78bca3,0xd4a35e][k]),-1.32+i*1.02+k*.28,.4+j*.48,.22,fridge)}cube(3.6,1.15,1.35,mats.wood,4.6,.58,3.7);cube(3.8,.13,1.48,mats.white,4.6,1.2,3.7);cube(.8,.12,.7,mats.dark,4.4,1.34,3.65);cube(.64,.43,.08,mats.dark,4.4,1.65,3.35);cube(.45,.28,.04,material(0x74c6d5,.15,.2),4.4,1.65,3.29);cube(.45,.24,.33,mats.dark,5.55,1.39,3.5);cube(1.3,.9,1.2,mats.white,-5.8,.45,4.1);cube(1.35,.08,1.26,mats.metal,-5.8,.95,4.1);for(let i=0;i<6;i++)cylinder(.12,.12,.32,material(0x7aaf83),-6.28+i*.2,1.13,4.1);for(let k=0;k<3;k++){const x=-5.5+k*2.7;cube(1.5,.85,.9,mats.metal,x,.44,-5.65);cube(1.42,.72,.08,mats.glass,x,.47,-5.13);for(let j=0;j<5;j++){cube(.18,.28,.16,material([0x75a9d1,0xd6a85e,0xc77c8c][k]),x-.5+j*.24,.46,-5.0)}}cube(1.15,1.3,.7,mats.white,-5.8,.65,2.3);cube(.9,.45,.54,mats.dark,-5.8,1.55,2.3);cube(.7,.3,.05,mats.glass,-5.8,1.55,2.6);for(let j=0;j<4;j++){cube(.48,.25,.38,mats.white,-4.8+j*.75,1.9,-6.1)}for(let i=0;i<4;i++){const x=-5.1+i*2.65;for(let j=0;j<6;j++){cube(.15,.22,.18,material([0x65a6c9,0xe2b46a,0xbf7474,0x8cb88a][i]),x-.65+j*.23,1.82,-2.35)}}cube(2.5,.12,.16,mats.green,0,2.55,6.15);cube(.1,2.3,.1,mats.metal,-1.2,1.15,6.1);cube(.1,2.3,.1,mats.metal,1.2,1.15,6.1);cube(1.08,2,.06,mats.glass,-.59,1.1,6.1);cube(1.08,2,.06,mats.glass,.59,1.1,6.1);const modelURL='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb';let customers=[],template=null;let inventory=30,sales=0,queue=[],cash=5000,staff=false,restockTime=0;try{const d=JSON.parse(localStorage.getItem('store3d-v6')||'null');if(d){inventory=d.inventory;cash=d.cash;sales=d.sales;staff=d.staff}}catch(e){}function save(){try{localStorage.setItem('store3d-v6',JSON.stringify({inventory,cash,sales,staff}))}catch(e){}}function hud(t){msg.textContent=t+'｜現金 $'+cash+'｜庫存 '+inventory+'｜售出 '+sales+'｜隊伍 '+queue.length}function makeFallbackPerson(){const g=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:0xf0c6a0});const shirt=new THREE.MeshStandardMaterial({color:0x327fd1});const pants=new THREE.MeshStandardMaterial({color:0x253e65});function part(w,h,d,mat,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);g.add(o);return o}part(.46,.65,.25,shirt,0,1.08,0);part(.32,.32,.3,skin,0,1.62,0);const ll=part(.17,.62,.2,pants,-.14,.43,0),rl=part(.17,.62,.2,pants,.14,.43,0),la=part(.15,.58,.18,skin,-.34,1.06,0),ra=part(.15,.58,.18,skin,.34,1.06,0);g.userData.limbs=[ll,rl,la,ra];return g}template=makeFallbackPerson();for(let i=0;i<3;i++)spawn();msg.textContent='顧客已進店（內建人物模型）';const loader=new GLTFLoader();loader.load(modelURL,gltf=>{if(!gltf.scene)return;msg.textContent='人物模型已載入；使用可動作內建角色'},undefined,e=>{msg.textContent='顧客已進店，使用內建人物模型'});function spawn(){if(!template||customers.length>=8)return;const person=template.clone(true);person.position.set(0,0,7.5);scene.add(person);const shelf=Math.floor(Math.random()*3);customers.push({person,mode:'shop',target:new THREE.Vector3(-4+shelf*2.7,0,-1),wait:0,speed:1.3,walk:0,cart:null})}function lineup(){queue.forEach((c,i)=>c.target.set(4.5,0,2.4+i*1.05))}function pay(c){if(queue[0]!==c)return;queue.shift();if(c.cart&&inventory>0){inventory--;sales++;cash+=49;hud('結帳成功')}else hud('缺貨離店');save();c.mode='exit';c.target.set(0,0,7.5);lineup()}document.getElementById('npc').onclick=spawn;document.getElementById('buy').onclick=()=>{if(cash<150)return hud('現金不足');cash-=150;inventory+=10;save();hud('進貨完成')};document.getElementById('hire').onclick=()=>{if(staff)return hud('已有補貨員');if(cash<1200)return hud('現金不足');cash-=1200;staff=true;save();hud('已雇用補貨員')};document.getElementById('save').onclick=()=>{save();hud('進度已儲存')};document.getElementById('reset').onclick=()=>{camera.position.set(13,14,17);orbit.target.set(0,.8,0);orbit.update()};document.getElementById('quality').onclick=()=>{renderer.setPixelRatio(1);sunlight.castShadow=false;renderer.shadowMap.enabled=false;msg.textContent='已切換低畫質，減少 iPhone 負擔'};function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;customers.slice().forEach(c=>{if(c.wait>0){c.wait-=dt;return}const p=c.person,dx=c.target.x-p.position.x,dz=c.target.z-p.position.z,d=Math.hypot(dx,dz);if(d>.15){const step=Math.min(d,dt*c.speed);p.position.x+=dx/d*step;p.position.z+=dz/d*step;p.rotation.y=Math.atan2(dx,dz);c.walk+=dt*9;const limbs=p.userData.limbs;if(limbs){limbs[0].rotation.x=Math.sin(c.walk)*.45;limbs[1].rotation.x=-Math.sin(c.walk)*.45;limbs[2].rotation.x=-Math.sin(c.walk)*.38;limbs[3].rotation.x=Math.sin(c.walk)*.38}}else if(c.mode==='shop'){if(inventory>0){const item=new THREE.Mesh(new THREE.BoxGeometry(.2,.22,.16),new THREE.MeshStandardMaterial({color:0xe5c45d}));item.position.set(.4,1.05,.25);p.add(item);c.cart=item}c.mode='queue';queue.push(c);lineup();c.wait=2}else if(c.mode==='queue'&&queue[0]===c){c.mode='pay';c.wait=2}else if(c.mode==='pay'){pay(c)}else if(c.mode==='exit'){scene.remove(p);customers.splice(customers.indexOf(c),1)}});restockTime+=dt;if(staff&&inventory<6&&restockTime>7&&cash>=150){restockTime=0;cash-=150;inventory+=10;save();hud('員工自動補貨')}orbit.update();renderer.render(scene,camera)}requestAnimationFrame(loop);setInterval(spawn,6500);msg.textContent='3D 商店已顯示，正在載入人物模型…'}catch(e){error(e)}</script></body></html>
