<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨 2.5D</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2a;color:#eef6ff;font:15px system-ui}header{padding:14px;background:#19344b}h1{font-size:21px;margin:0 0 8px}.stats{display:flex;flex-wrap:wrap;gap:9px}.stats span{background:#28445b;border-radius:9px;padding:8px}main{max-width:1000px;margin:auto;padding:12px}canvas{display:block;width:100%;background:#e5d8bc;border:3px solid #5c7585;border-radius:15px;touch-action:manipulation}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{border:0;background:#38c5a5;color:#092d27;font-weight:700;border-radius:10px;padding:12px}button.selected{background:#ffc768}#note{background:#203e54;border-radius:10px;padding:10px;min-height:45px}.help{color:#b4c9d7;line-height:1.6}</style></head><body><header><h1>🏪 便利商店大亨 · 2.5D 立體經營版</h1><div class="stats"><span id="money"></span><span id="stock"></span><span id="sales"></span><span id="staff"></span><span id="queue"></span></div></header><main><canvas id="game" width="800" height="560"></canvas><nav><button id="shelf">擺放貨架 $300</button><button id="fridge">擺放冰箱 $500</button><button id="remove">移除設備</button><button id="buy">進貨10件 $150</button><button id="hire">雇用補貨員 $1200</button><button id="save">儲存</button></nav><div id="note">歡迎營業！點選設備，再點商店空地擺放。</div><p class="help">手機可直接點地板擺放貨架或冰箱；NPC 會走向設備選購商品、排隊結帳。進度自動保存在此瀏覽器，與 3D 版本分開。</p></main><script>
(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),note=document.getElementById('note'),W=10,H=7,S=70,OX=50,OY=35;
let state={money:5000,stock:30,sales:0,staff:false,fixtures:[{x:2,y:2,type:'shelf'},{x:5,y:2,type:'shelf'},{x:7,y:2,type:'fridge'}]};
try{const d=JSON.parse(localStorage.getItem('store2d-v1')||'null');if(d&&Array.isArray(d.fixtures))state={...state,...d}}catch(e){}
let mode='',people=[],queue=[],spawnClock=0,staffClock=0,last=performance.now();
function save(){try{localStorage.setItem('store2d-v1',JSON.stringify(state))}catch(e){}}function say(t){note.textContent=t}function stats(){for(const [id,v] of Object.entries({money:'💰 $'+state.money,stock:'📦 '+state.stock,sales:'🧾 '+state.sales,staff:state.staff?'👩‍💼 已雇用':'👩‍💼 未雇用',queue:'👥 排隊 '+queue.length}))document.getElementById(id).textContent=v}
function blocked(x,y){return x<0||x>=W||y<0||y>=H||state.fixtures.some(f=>f.x===x&&f.y===y)||(x===8&&y===5)||(x===5&&y===6)}
function path(a,b){const start=[Math.round(a.x),Math.round(a.y)],goal=[Math.round(b.x),Math.round(b.y)],key=p=>p[0]+','+p[1],open=[start],seen=new Set([key(start)]),prev=new Map();while(open.length){const p=open.shift();if(p[0]===goal[0]&&p[1]===goal[1]){const out=[];let q=p;while(q){out.unshift({x:q[0],y:q[1]});q=prev.get(key(q))}return out}for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[p[0]+d[0],p[1]+d[1]];if(blocked(n[0],n[1])||seen.has(key(n)))continue;seen.add(key(n));prev.set(key(n),p);open.push(n)}}return []}
function destination(p,x,y){p.route=path({x:Math.round(p.x),y:Math.round(p.y)},{x,y}).slice(1);p.goal={x,y}}
function spawn(){if(people.length>=9||!state.fixtures.length)return;const f=state.fixtures[Math.floor(Math.random()*state.fixtures.length)],p={x:5,y:6,phase:'shop',wait:0,carry:false,t:0,color:['#377cbb','#cb6c55','#5c9a6b','#966db7'][Math.floor(Math.random()*4)]};people.push(p);const spots=[[f.x-1,f.y],[f.x+1,f.y],[f.x,f.y-1],[f.x,f.y+1]].filter(q=>!blocked(q[0],q[1]));if(!spots.length){people.pop();return}const q=spots[Math.floor(Math.random()*spots.length)];destination(p,q[0],q[1])}
function lineup(){queue.forEach((p,i)=>destination(p,8,4-Math.min(i,3)))}
function checkout(p){if(queue[0]!==p)return;queue.shift();if(p.carry&&state.stock>0){state.stock--;state.money+=49;state.sales++;say('🧾 結帳成功 +$49')}else say('商品缺貨，顧客離店');p.phase='exit';destination(p,5,6);lineup();save()}
function update(dt){spawnClock+=dt;if(spawnClock>5){spawnClock=0;spawn()}staffClock+=dt;if(state.staff&&state.stock<6&&state.money>=150&&staffClock>7){staffClock=0;state.money-=150;state.stock+=10;save();say('👩‍💼 店員自動補貨 10 件')}for(const p of [...people]){p.t+=dt;if(p.route?.length){const q=p.route[0],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<.04){p.x=q.x;p.y=q.y;p.route.shift()}else{const v=Math.min(d,dt*1.5);p.x+=dx/d*v;p.y+=dy/d*v}continue}if(p.wait>0){p.wait-=dt;continue}if(p.phase==='shop'){p.carry=state.stock>queue.filter(c=>c.carry).length;p.phase='queue';p.wait=1.6;queue.push(p);lineup()}else if(p.phase==='queue'&&queue[0]===p){p.phase='pay';p.wait=1.5}else if(p.phase==='pay')checkout(p);else if(p.phase==='exit')people.splice(people.indexOf(p),1)}stats()}
function prism(x,y,w,h,height,front,top,side){ctx.fillStyle='rgba(32,46,51,.22)';ctx.fillRect(x+9,y+9,w,h);ctx.fillStyle=front;ctx.fillRect(x,y,w,h);ctx.fillStyle=top;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,y-height);ctx.lineTo(x+w+12,y-height);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();ctx.fillStyle=side;ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+12,y-height);ctx.lineTo(x+w+12,y+h-height);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill()}
function draw(){ctx.clearRect(0,0,800,560);const bg=ctx.createLinearGradient(0,0,800,560);bg.addColorStop(0,'#d6e5df');bg.addColorStop(1,'#a9c9bc');ctx.fillStyle=bg;ctx.fillRect(0,0,800,560);ctx.fillStyle='#e9dcc0';ctx.fillRect(OX,OY,W*S,H*S);for(let y=0;y<H;y++)for(let x=0;x<W;x++){ctx.fillStyle=(x+y)%2?'#e5d4b6':'#efe0c5';ctx.fillRect(OX+x*S,OY+y*S,S,S);ctx.strokeStyle='rgba(137,111,77,.17)';ctx.strokeRect(OX+x*S,OY+y*S,S,S)}
ctx.fillStyle='#c0e5f1';ctx.fillRect(OX+5*S,OY+7*S-13,S,13);ctx.fillStyle='#236d58';ctx.font='bold 17px system-ui';ctx.fillText('入口',OX+5*S+14,OY+7*S-22);
prism(OX+8*S+5,OY+5*S+20,S-12,S-24,20,'#8c5747','#c48a6a','#663f36');ctx.fillStyle='#f8f3e9';ctx.font='bold 14px system-ui';ctx.fillText('收銀',OX+8*S+12,OY+5*S+52);
for(const f of state.fixtures){const x=OX+f.x*S+7,y=OY+f.y*S+13;if(f.type==='fridge'){prism(x,y,S-19,S-22,27,'#78bad6','#d8f4fc','#4b8caa');ctx.fillStyle='#e9fbff';ctx.fillRect(x+8,y+7,S-35,S-41);ctx.fillStyle='#78afcf';ctx.fillRect(x+10,y+12,S-39,6);ctx.fillStyle='#79bbd8';ctx.fillRect(x+10,y+28,S-39,6);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('冷藏',x+12,y+44)}else{prism(x,y,S-19,S-22,22,'#a97c55','#dfb68b','#815637');ctx.fillStyle='#583c2b';for(let i=0;i<3;i++){ctx.fillRect(x+5,y+7+i*13,S-28,3);for(let j=0;j<4;j++){ctx.fillStyle=['#e68b6a','#f5cb5d','#74b7aa','#9e8fd1'][(i+j)%4];ctx.fillRect(x+7+j*11,y+9+i*13,8,10)}}ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.fillText('貨架',x+13,y+48)}}
for(const p of people){const x=OX+(p.x+.5)*S,y=OY+(p.y+.5)*S;ctx.fillStyle='rgba(35,52,63,.25)';ctx.beginPath();ctx.ellipse(x+4,y+17,16,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2f4354';ctx.fillRect(x-8,y+5,6,15);ctx.fillRect(x+2,y+5,6,15);ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(x-12,y-15,24,29,8);ctx.fill();ctx.fillStyle='#f4d3ac';ctx.beginPath();ctx.arc(x,y-22,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#273948';ctx.fillRect(x-5,y-24,3,3);ctx.fillRect(x+3,y-24,3,3);if(p.carry){ctx.fillStyle='#f2ce58';ctx.fillRect(x+12,y-5,12,15)}}}
cv.addEventListener('click',e=>{if(!mode)return;const rect=cv.getBoundingClientRect(),x=Math.floor(((e.clientX-rect.left)*800/rect.width-OX)/S),y=Math.floor(((e.clientY-rect.top)*560/rect.height-OY)/S);if(x<0||x>=W||y<0||y>=H)return;if(mode==='remove'){const i=state.fixtures.findIndex(f=>f.x===x&&f.y===y);if(i>=0){state.fixtures.splice(i,1);save();say('設備已移除')}else say('這裡沒有設備')}else{const cost=mode==='shelf'?300:500;if(blocked(x,y))return say('這個位置不能擺放');if(state.money<cost)return say('現金不足');state.money-=cost;state.fixtures.push({x,y,type:mode});save();say('設備擺放成功')}stats()});
for(const type of ['shelf','fridge','remove'])document.getElementById(type).onclick=()=>{mode=type;for(const id of ['shelf','fridge','remove'])document.getElementById(id).classList.toggle('selected',id===type);say(mode==='remove'?'點選要移除的設備':'點選空地擺放'+(mode==='shelf'?'貨架':'冰箱'))};
document.getElementById('buy').onclick=()=>{if(state.money<150)return say('現金不足');state.money-=150;state.stock+=10;save();stats();say('📦 已進貨 10 件')};
document.getElementById('hire').onclick=()=>{if(state.staff)return say('已雇用補貨員');if(state.money<1200)return say('現金不足');state.money-=1200;state.staff=true;save();stats();say('👩‍💼 補貨員開始工作')};
document.getElementById('save').onclick=()=>{save();say('已儲存在目前瀏覽器')};stats();spawn();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
