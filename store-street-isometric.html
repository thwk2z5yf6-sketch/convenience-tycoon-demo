<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨 街景立體版</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2a;color:#eef6ff;font:15px system-ui}header{padding:14px;background:#19344b}h1{font-size:21px;margin:0 0 8px}.stats{display:flex;flex-wrap:wrap;gap:9px}.stats span{background:#28445b;border-radius:9px;padding:8px}main{max-width:1000px;margin:auto;padding:12px}canvas{display:block;width:100%;background:#e5d8bc;border:3px solid #5c7585;border-radius:15px;touch-action:manipulation}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button{border:0;background:#38c5a5;color:#092d27;font-weight:700;border-radius:10px;padding:12px}button.selected{background:#ffc768}#note{background:#203e54;border-radius:10px;padding:10px;min-height:45px}.help{color:#b4c9d7;line-height:1.6}</style></head><body><header><h1>🏪 便利商店大亨 · 像素風街景立體版</h1><div class="stats"><span id="money"></span><span id="stock"></span><span id="sales"></span><span id="staff"></span><span id="queue"></span></div></header><main><canvas id="game" width="800" height="560"></canvas><nav><button id="shelf">擺放貨架 $300</button><button id="fridge">擺放冰箱 $500</button><button id="remove">移除設備</button><button id="buy">進貨10件 $150</button><button id="hire">雇用補貨員 $1200</button><button id="save">儲存</button></nav><div id="note">歡迎營業！點選設備，再點商店空地擺放。</div><p class="help">立體等角街景版：手機可點地板擺放貨架或冰箱；NPC 會走向設備選購商品、排隊結帳。進度自動保存在此瀏覽器，與 3D 版本分開。</p></main><script>
(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),note=document.getElementById('note'),W=10,H=7,S=70,OX=50,OY=35;
let state={money:5000,stock:30,sales:0,staff:false,fixtures:[{x:2,y:2,type:'shelf'},{x:5,y:2,type:'shelf'},{x:7,y:2,type:'fridge'}]};
try{const d=JSON.parse(localStorage.getItem('store2d-v1')||'null');if(d&&Array.isArray(d.fixtures))state={...state,...d}}catch(e){}
let mode='',people=[],queue=[],spawnClock=0,staffClock=0,last=performance.now();
function save(){try{localStorage.setItem('store2d-v1',JSON.stringify(state))}catch(e){}}function say(t){note.textContent=t}function stats(){for(const [id,v] of Object.entries({money:'💰 $'+state.money,stock:'📦 '+state.stock,sales:'🧾 '+state.sales,staff:state.staff?'👩‍💼 已雇用':'👩‍💼 未雇用',queue:'👥 排隊 '+queue.length}))document.getElementById(id).textContent=v}
function blocked(x,y){return x<0||x>=W||y<0||y>=H||state.fixtures.some(f=>f.x===x&&f.y===y)||(x===8&&y===5)||(x===5&&y===6)}
function path(a,b){const start=[Math.round(a.x),Math.round(a.y)],goal=[Math.round(b.x),Math.round(b.y)],key=p=>p[0]+','+p[1],open=[start],seen=new Set([key(start)]),prev=new Map();while(open.length){const p=open.shift();if(p[0]===goal[0]&&p[1]===goal[1]){const out=[];let q=p;while(q){out.unshift({x:q[0],y:q[1]});q=prev.get(key(q))}return out}for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[p[0]+d[0],p[1]+d[1]];if(blocked(n[0],n[1])||seen.has(key(n)))continue;seen.add(key(n));prev.set(key(n),p);open.push(n)}}return []}
function destination(p,x,y){p.route=path({x:Math.round(p.x),y:Math.round(p.y)},{x,y}).slice(1);p.goal={x,y}}
function spawn(){if(people.length>=9||!state.fixtures.length)return;const f=state.fixtures[Math.floor(Math.random()*state.fixtures.length)],p={x:5,y:6,phase:'shop',wait:0,carry:false,t:0,color:['#377cbb','#cb6c55','#5c9a6b','#966db7'][Math.floor(Math.random()*4)]};people.push(p);const spots=[[f.x-1,f.y],[f.x+1,f.y],[f.x,f.y-1],[f.x,f.y+1]].filter(q=>!blocked(q[0],q[1]));if(!spots.length){people.pop();return}const q=spots[Math.floor(Math.random()*spots.length)];destination(p,q[0],q[1])}
function lineup(){queue.forEach((p,i)=>destination(p,8,4-Math.min(i,3)))}
function checkout(p){if(queue[0]!==p)return;queue.shift();if(p.carry&&state.stock>0){state.stock--;state.money+=49;state.sales++;say('🧾 結帳成功 +$49')}else say('商品缺貨，顧客離店');p.phase='exit';destination(p,5,6);lineup();save()}
function update(dt){spawnClock+=dt;if(spawnClock>5){spawnClock=0;spawn()}staffClock+=dt;if(state.staff&&state.stock<6&&state.money>=150&&staffClock>7){staffClock=0;state.money-=150;state.stock+=10;save();say('👩‍💼 店員自動補貨 10 件')}for(const p of [...people]){p.t+=dt;if(p.route?.length){const q=p.route[0],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);if(d<.04){p.x=q.x;p.y=q.y;p.route.shift()}else{const v=Math.min(d,dt*1.5);p.x+=dx/d*v;p.y+=dy/d*v}continue}if(p.wait>0){p.wait-=dt;continue}if(p.phase==='shop'){p.carry=state.stock>queue.filter(c=>c.carry).length;p.phase='queue';p.wait=1.6;queue.push(p);lineup()}else if(p.phase==='queue'&&queue[0]===p){p.phase='pay';p.wait=1.5}else if(p.phase==='pay')checkout(p);else if(p.phase==='exit')people.splice(people.indexOf(p),1)}stats()}
const SX=34,SY=19,BASEX=400,BASEY=112;
function iso(x,y,z=0){return {x:BASEX+(x-y)*SX,y:BASEY+(x+y)*SY-z}}
function poly(pts,color,stroke){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function tile(x,y,c){poly([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],c,'#d9c7a6')}
function block(x,y,w,h,z,front,side,top){const a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+h),d=iso(x,y+h),A=iso(x,y,z),B=iso(x+w,y,z),C=iso(x+w,y+h,z),D=iso(x,y+h,z);poly([a,b,B,A],front);poly([b,c,C,B],side);poly([A,B,C,D],top,'rgba(32,48,60,.35)')}
function person(x,y,color,carry=false){const p=iso(x+.5,y+.5);ctx.fillStyle='rgba(18,36,48,.22)';ctx.beginPath();ctx.ellipse(p.x+3,p.y+3,12,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#334d62';ctx.fillRect(p.x-7,p.y-12,5,13);ctx.fillRect(p.x+2,p.y-12,5,13);ctx.fillStyle=color;ctx.fillRect(p.x-10,p.y-31,20,22);ctx.fillStyle='#f2c9a0';ctx.fillRect(p.x-8,p.y-44,16,14);ctx.fillStyle='#3c3d45';ctx.fillRect(p.x-8,p.y-46,16,5);if(carry){ctx.fillStyle='#f5cf52';ctx.fillRect(p.x+10,p.y-22,11,12)}}
function tree(x,y){const p=iso(x,y);ctx.fillStyle='#76583c';ctx.fillRect(p.x-3,p.y-37,6,35);for(const [dx,dy,r] of [[-12,-53,15],[10,-58,16],[0,-69,17]]){ctx.fillStyle='#3d8c5c';ctx.beginPath();ctx.arc(p.x+dx,p.y+dy,r,0,7);ctx.fill()}}
function draw(){ctx.clearRect(0,0,800,560);ctx.fillStyle='#a9d2a9';ctx.fillRect(0,0,800,560);
ctx.fillStyle='#57626d';ctx.beginPath();ctx.moveTo(0,310);ctx.lineTo(280,560);ctx.lineTo(510,560);ctx.lineTo(0,110);ctx.fill();ctx.beginPath();ctx.moveTo(490,0);ctx.lineTo(800,270);ctx.lineTo(800,420);ctx.lineTo(340,0);ctx.fill();
ctx.strokeStyle='#f7e9aa';ctx.lineWidth=4;ctx.setLineDash([20,18]);ctx.beginPath();ctx.moveTo(0,228);ctx.lineTo(360,560);ctx.moveTo(580,0);ctx.lineTo(800,196);ctx.stroke();ctx.setLineDash([]);
poly([iso(-.8,-.8),iso(10.8,-.8),iso(10.8,7.8),iso(-.8,7.8)],'#a9a79b');for(let y=0;y<H;y++)for(let x=0;x<W;x++)tile(x,y,(x+y)%2?'#f1e0bf':'#f8e9d0');
block(-.7,-.7,11.4,.35,42,'#e7d7be','#d6c6aa','#e8a763');block(-.7,-.7,.35,8.4,42,'#e5d2b9','#cfb9a3','#e9ad65');
for(const f of state.fixtures){const x=f.x+.12,y=f.y+.12;if(f.type==='fridge'){block(x,y,.8,.8,45,'#8bc7dc','#5291ad','#e8f7ff');const p=iso(x+.13,y+.82,36);ctx.fillStyle='#d6f3ff';ctx.fillRect(p.x-11,p.y-11,21,17)}else{block(x,y,.8,.8,39,'#b88155','#805a43','#dfb483');for(let i=0;i<3;i++){const p=iso(x+.18+i*.2,y+.35,42);ctx.fillStyle=['#f3ce59','#e67f74','#70ba9a'][i];ctx.fillRect(p.x-5,p.y-9,10,12)}}}
block(8,5,.9,.9,34,'#a26951','#704c3e','#e6b28b');let counter=iso(8.5,5.5,39);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('收銀',counter.x-12,counter.y);
const arr=[...people].sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const p of arr)person(p.x,p.y,p.color,p.carry);
tree(0,8.7);tree(3,10);tree(10.7,1);const door=iso(5.5,7.4);ctx.fillStyle='#2b8061';ctx.font='bold 16px system-ui';ctx.fillText('⬆ 商店入口',door.x-42,door.y+24);
ctx.fillStyle='#263b50';ctx.font='bold 17px system-ui';ctx.fillText('🏪 便利商店街景',18,30)}
cv.addEventListener('click',e=>{if(!mode)return;const rect=cv.getBoundingClientRect(),px=(e.clientX-rect.left)*800/rect.width-BASEX,py=(e.clientY-rect.top)*560/rect.height-BASEY,x=Math.floor((px/SX+py/SY)/2),y=Math.floor((py/SY-px/SX)/2);if(x<0||x>=W||y<0||y>=H)return;if(mode==='remove'){const i=state.fixtures.findIndex(f=>f.x===x&&f.y===y);if(i>=0){state.fixtures.splice(i,1);save();say('設備已移除')}else say('這裡沒有設備')}else{const cost=mode==='shelf'?300:500;if(blocked(x,y))return say('這個位置不能擺放');if(state.money<cost)return say('現金不足');state.money-=cost;state.fixtures.push({x,y,type:mode});save();say('設備擺放成功')}stats()});
for(const type of ['shelf','fridge','remove'])document.getElementById(type).onclick=()=>{mode=type;for(const id of ['shelf','fridge','remove'])document.getElementById(id).classList.toggle('selected',id===type);say(mode==='remove'?'點選要移除的設備':'點選空地擺放'+(mode==='shelf'?'貨架':'冰箱'))};
document.getElementById('buy').onclick=()=>{if(state.money<150)return say('現金不足');state.money-=150;state.stock+=10;save();stats();say('📦 已進貨 10 件')};
document.getElementById('hire').onclick=()=>{if(state.staff)return say('已雇用補貨員');if(state.money<1200)return say('現金不足');state.money-=1200;state.staff=true;save();stats();say('👩‍💼 補貨員開始工作')};
document.getElementById('save').onclick=()=>{save();say('已儲存在目前瀏覽器')};stats();spawn();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
