<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨｜3D 場景預覽</title><style>*{box-sizing:border-box}body{margin:0;background:#101c2a;color:white;font:15px system-ui}header{padding:13px 16px;background:#182b3a;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:19px}#stage{height:72vh;min-height:390px;position:relative;background:#a7c4d1}canvas{display:block;width:100%;height:100%;touch-action:none}#message{position:absolute;top:12px;left:12px;right:12px;max-width:480px;background:#102e42e8;padding:12px;border-radius:12px;line-height:1.6;pointer-events:none}#controls{padding:13px;display:flex;gap:8px;flex-wrap:wrap}button{background:#29bf9b;color:#052e26;border:0;padding:11px 16px;border-radius:10px;font-weight:bold}small{color:#a8bfc9}#fallback{display:none;padding:40px 20px;background:#e5f0f2;color:#284457;text-align:center}</style></head><body><header><h1>🏪 便利商店大亨 · 3D 場景預覽</h1><small>測試版</small></header><div id="stage"><div id="message">正在載入真正的 3D 場景與人物模型…</div><div id="fallback"><h2>3D 模型未能載入</h2><p>目前沒有啟動 3D 繪圖。請截圖這裡顯示的錯誤訊息。</p><p id="err"></p></div></div><div id="controls"><button id="reset">重設視角</button><button id="quality">降低畫質</button><button id="npc">新增顧客</button></div><p style="padding:0 14px"><small>這是獨立 3D 場景測試，不會覆蓋你原本的遊戲或存檔。用手指拖曳可旋轉視角，雙指縮放。設備為原創 3D 場景；人物模型採用公開範例資產，後續再換成正式授權的商店與角色模型。</small></p><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const stage=document.getElementById('stage'),msg=document.getElementById('message');function error(e){msg.textContent='⚠️ '+String(e?.message||e);document.getElementById('fallback').style.display='block';document.getElementById('err').textContent=String(e?.message||e)}window.addEventListener('unhandledrejection',e=>error(e.reason));window.addEventListener('error',e=>error(e.error||e.message));try{const scene=new THREE.Scene();scene.background=new THREE.Color(0xc5d7df);scene.fog=new THREE.Fog(0xc5d7df,26,55);const camera=new THREE.PerspectiveCamera(42,1,.1,120);camera.position.set(13,14,17);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;stage.insertBefore(renderer.domElement,msg);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.8,0);orbit.enableDamping=true;orbit.maxPolarAngle=1.5;orbit.minDistance=8;orbit.maxDistance=27;const ambient=new THREE.HemisphereLight(0xe8f6ff,0x84939c,2.2);scene.add(ambient);const sunlight=new THREE.DirectionalLight(0xfff8e8,2.7);sunlight.position.set(9,16,8);sunlight.castShadow=true;sunlight.shadow.mapSize.set(1024,1024);sunlight.shadow.camera.left=-14;sunlight.shadow.camera.right=14;sunlight.shadow.camera.top=14;sunlight.shadow.camera.bottom=-14;scene.add(sunlight);function material(color,metalness=0,roughness=.65,opacity=1){return new THREE.MeshStandardMaterial({color,metalness,roughness,transparent:opacity<1,opacity,side:THREE.DoubleSide})}const mats={floor:material(0xe6e4dd),wall:material(0xeef0ed),metal:material(0x8798a0,.7,.27),white:material(0xeef4f6,.1,.4),dark:material(0x334b57,.45,.35),glass:material(0xb7e8f4,.1,.15,.38),green:material(0x159f78),orange:material(0xefaa4e),wood:material(0x9b7860)};function cube(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function cylinder(r1,r2,h,m,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}cube(15,.3,13,mats.floor,0,-.16,0);for(let x=-7;x<8;x++){cube(.012,.013,13,material(0xbac0bc),x,.006,0)}for(let z=-6;z<7;z++){cube(15,.013,.012,material(0xbac0bc),0,.007,z)}cube(15,3,.2,mats.wall,0,1.5,-6.5);cube(.2,3,13,mats.wall,-7.5,1.5,0);cube(.2,3,13,mats.wall,7.5,1.5,0);cube(15,.23,.28,mats.green,0,3.02,-6.5);cube(15,.11,.31,mats.orange,0,2.85,-6.5);for(let x=-5.5;x<=5.5;x+=2.8){cube(1.9,.08,.6,material(0xf4fbff,.1,.2),x,2.85,-2);let light=new THREE.PointLight(0xffffff,.45,7);light.position.set(x,2.7,-2);scene.add(light)}const shelves=[];for(let i=0;i<4;i++){let x=-5.1+i*2.65,z=-2.1;const group=new THREE.Group();group.position.set(x,0,z);scene.add(group);shelves.push(group);for(let xx of [-.92,.92])for(let zz of [-.75,.75])cube(.07,1.65,.08,mats.metal,xx,.82,zz,group);for(let y of [.23,.68,1.13,1.58])cube(2,.07,1.7,mats.metal,0,y,0,group);for(let row=0;row<3;row++)for(let col=0;col<7;col++){let m=material([0x69a7c3,0xf3b565,0xcc7c77,0x88b58b][(col+i)%4],.05,.5);if(i===0){cylinder(.11,.11,.34,m,-.76+col*.25,.43+row*.45,-.34,group);cylinder(.11,.11,.34,m,-.76+col*.25,.43+row*.45,.28,group)}else{cube(.19,.29,.19,m,-.76+col*.25,.43+row*.45,-.34,group);cube(.19,.29,.19,m,-.76+col*.25,.43+row*.45,.28,group)}}}const fridge=new THREE.Group();fridge.position.set(5.5,0,-5.9);scene.add(fridge);cube(3.2,2.6,.9,mats.metal,0,1.3,0,fridge);cube(3,.25,.95,mats.dark,0,2.52,0,fridge);for(let i=0;i<3;i++){cube(.94,2.1,.045,mats.glass,-1.02+i*1.02,1.33,.49,fridge);cube(.035,1.9,.07,mats.white,-.6+i*1.02,1.32,.54,fridge);for(let j=0;j<4;j++)for(let k=0;k<3;k++)cylinder(.095,.095,.28,material([0x7ec0d2,0x78bca3,0xd4a35e][k]),-1.32+i*1.02+k*.28,.4+j*.48,.22,fridge)}cube(3.6,1.15,1.35,mats.wood,4.6,.58,3.7);cube(3.8,.13,1.48,mats.white,4.6,1.2,3.7);cube(.8,.12,.7,mats.dark,4.4,1.34,3.65);cube(.64,.43,.08,mats.dark,4.4,1.65,3.35);cube(.45,.28,.04,material(0x74c6d5,.15,.2),4.4,1.65,3.29);cube(.45,.24,.33,mats.dark,5.55,1.39,3.5);cube(1.3,.9,1.2,mats.white,-5.8,.45,4.1);cube(1.35,.08,1.26,mats.metal,-5.8,.95,4.1);for(let i=0;i<6;i++)cylinder(.12,.12,.32,material(0x7aaf83),-6.28+i*.2,1.13,4.1);const modelURL='https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb';let customers=[],template=null;const loader=new GLTFLoader();loader.load(modelURL,gltf=>{template=gltf.scene;template.scale.setScalar(.95);for(let i=0;i<3;i++)spawn();msg.textContent='✅ 3D 場景與人物模型已載入。拖曳旋轉、雙指縮放。'},undefined,e=>{msg.textContent='⚠️ 商店 3D 已顯示，但人物模型未能下載；請檢查網路。';});function spawn(){if(!template)return;const person=template.clone(true);person.position.set(0,0,7.5);scene.add(person);customers.push({person,phase:Math.random()*6,speed:.3+Math.random()*.2})}document.getElementById('npc').onclick=spawn;document.getElementById('reset').onclick=()=>{camera.position.set(13,14,17);orbit.target.set(0,.8,0);orbit.update()};document.getElementById('quality').onclick=()=>{renderer.setPixelRatio(1);sunlight.castShadow=false;renderer.shadowMap.enabled=false;msg.textContent='已切換低畫質，減少 iPhone 負擔'};function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;customers.forEach(c=>{c.phase+=dt*c.speed;let a=c.phase%6;let p=c.person;if(a<1.5)p.position.set(0,0,7.5-a*4);else if(a<3)p.position.set((a-1.5)*-3,0,1.5-(a-1.5)*2);else if(a<4.5)p.position.set(-4.5+(a-3)*6,0,-1.5+(a-3)*3);else p.position.set(4.5,0,3+(a-4.5)*3);p.rotation.y=Math.atan2(Math.sin(c.phase),Math.cos(c.phase))});orbit.update();renderer.render(scene,camera)}requestAnimationFrame(loop);msg.textContent='3D 商店已顯示，正在載入人物模型…'}catch(e){error(e)}</script></body></html>
