="5"/><g fill="#a8d6e4" stroke="#fff" stroke-width="3"><rect x="596" y="173" width="35" height="116"/><rect x="638" y="173" width="35" height="116"/><rect x="680" y="173" width="33" height="116"/></g><rect x="555" y="355" width="174" height="75" fill="#78929a"/><polygon points="555,355 583,341 756,341 729,355" fill="#e7eeee"/><rect x="622" y="323" width="65" height="25" rx="3" fill="#344a54"/><rect x="638" y="329" width="32" height="10" fill="#81c7b4"/><g fill="#eff1ed" stroke="#859d9e" stroke-width="4"><rect x="155" y="355" width="135" height="50"/><rect x="350" y="317" width="145" height="50"/></g><g fill="#a3b9b4"><rect x="165" y="360" width="115" height="16"/><rect x="360" y="322" width="125" height="16"/></g><g><circle cx="520" cy="280" r="12" fill="#e9bd97"/><path d="M509 294h22v36h-22z" fill="#357f98"/><circle cx="682" cy="320" r="12" fill="#e9bd97"/><path d="M671 334h22v36h-22z" fill="#ca8668"/><circle cx="380" cy="405" r="12" fill="#e9bd97"/><path d="M369 419h22v36h-22z" fill="#65947b"/></g><text x="35" y="47" font-size="26" font-family="sans-serif" font-weight="bold" fill="#23485a">🏪 便利商店營業中</text><text x="35" y="78" font-size="16" font-family="sans-serif" fill="#486d79">商店場景預覽 · 動態遊戲載入中</text></svg><canvas id="scene"></canvas><div id="overlay">🏬 <b id="shopname">我的便利商店</b><br>顧客會自動進店、選購、排隊結帳</div></div><main><div id="status">商店營業中，歡迎光臨！</div><div class="panel"><h2>📦 商品進貨</h2><div class="grid" id="items"></div></div><div class="panel"><h2>👩‍💼 店務管理</h2><button id="hire">雇用自動補貨員 $1,500</button><button id="rename">更改店名</button><button id="reset">重新開始</button><p class="small">進度儲存在這台裝置的瀏覽器。這是原創 2.5D 模擬畫面，尚未支援 LINE 登入或雲端同步。</p></div></main><script>window.addEventListener('error',function(e){var el=document.getElementById('status');if(el)el.textContent='⚠️ 畫面錯誤：'+(e.message||'未知錯誤')});window.addEventListener('unhandledrejection',function(e){var el=document.getElementById('status');if(el)el.textContent='⚠️ 載入錯誤：'+String(e.reason||'未知原因')});</script><script>(()=>{'use strict';const $=id=>document.getElementById(id),key='real-store-25d-v1',goods=[['礦泉水','💧',10,19],['零食餅乾','🍪',22,39],['飯糰便當','🍱',38,65],['現煮咖啡','☕',27,55]];let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!Array.isArray(state.stock))state={cash:10000,sales:0,level:1,stock:[12,12,12,12],worker:false,name:'我的便利商店'};const save=()=>localStorage.setItem(key,JSON.stringify(state));let customers=[],clock=0,restock=0,last=performance.now(),view={w:900,h:600,scale:1,ox:0,oy:0};const canvas=$('scene'),ctx=canvas.getContext('2d');if(!ctx){$('status').textContent='繪圖功能未啟用，已顯示商店預覽。';return}function poly(p,c,stroke){ctx.beginPath();p.forEach((a,i)=>i?ctx.lineTo(a[0],a[1]):ctx.moveTo(a[0],a[1]));ctx.closePath();ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x,y,X,Y,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function box(x,y,w,h,depth,top,front,side){poly([[x,y],[x+depth,y-depth*.45],[x+w+depth,y-depth*.45],[x+w,y]],top);poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],front);poly([[x+w,y],[x+w+depth,y-depth*.45],[x+w+depth,y+h-depth*.45],[x+w,y+h]],side)}function label(t,x,y,size=13,color='#fff'){ctx.font='bold '+size+'px system-ui';ctx.fillStyle=color;ctx.fillText(t,x,y)}function shop(){poly([[90,170],[615,75],[855,210],[325,485]],'#c9ccca','#8faaa9');poly([[90,170],[615,75],[615,52],[90,148]],'#f0f2ef');poly([[90,170],[325,485],[325,457],[90,148]],'#c9d4d1');for(let i=0;i<13;i++){let a=i/13;line(90+525*a,170-95*a,325+530*a,485-275*a,'#aeb5b1',.65)}for(let j=0;j<9;j++){let a=j/9;line(90+235*a,170+315*a,615+240*a,75+135*a,'#aeb5b1',.65)}poly([[90,170],[615,75],[615,95],[90,191]],'#f1f2ee');poly([[615,75],[855,210],[855,230],[615,95]],'#eef0ec');for(let i=0;i<4;i++){let x=120+i*112,y=195-i*17;box(x,y,70,120,20,'#e8ebec','#899ba4','#52616a');for(let k=0;k<3;k++){rect(x+4,y+10+k*31,63,5,'#d3dadd');for(let j=0;j<4;j++){rect(x+7+j*15,y+17+k*31,10,18,['#61a8c9','#e0aa5d','#cc6f74','#81b58a'][i]);rect(x+7+j*15,y+31+k*31,10,2,'#f2e5c5')}}}box(580,150,138,145,18,'#b6cbd3','#e4eef1','#7c939f');for(let j=0;j<3;j++){rect(589+j*42,164,36,109,'#85b6c8');rect(595+j*42,178,25,6,'#b9e1ed');rect(595+j*42,205,25,6,'#b9e1ed');rect(595+j*42,231,25,6,'#b9e1ed');line(622+j*42,166,622+j*42,270,'#e5f2f5',3)}box(560,340,170,80,28,'#dce1e1','#6c858c','#4b6570');box(608,320,66,23,8,'#303c48','#343f47','#252e34');rect(623,328,33,9,'#65b2a3');box(380,335,105,53,20,'#f1eee4','#b2b4a9','#818c88');for(let i=0;i<5;i++){box(345+i*47,300-i*4,32,56,10,'#eff1ef','#c3cccb','#82939b');rect(350+i*47,314-i*4,24,12,'#e2a762')}box(124,330,140,60,23,'#f2f4ef','#a3b9b2','#718a88');for(let i=0;i<9;i++)rect(135+i*14,335,9,19,'#b7c9b0');box(712,240,82,105,17,'#e9f0f2','#8aa4b0','#557888');rect(718,257,69,64,'#8fc1d4');label('COLD',727,250,12,'#2d647c');poly([[110,151],[620,56],[855,190],[840,204],[616,75],[98,169]],'#078d75');poly([[110,151],[620,56],[622,66],[110,162]],'#f9f9f2');poly([[622,66],[855,190],[855,199],[622,75]],'#f9f9f2');poly([[110,162],[622,66],[622,73],[110,170]],'#f0904a');poly([[622,73],[855,199],[855,205],[622,80]],'#f0904a');label('FRESH 24',265,118,17,'#ffffff')}function person(n,t){let x=n.x,y=n.y;ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(x,y+8,15,6,0,0,Math.PI*2);ctx.fill();let step=Math.sin(t*7+n.id)*5;line(x-6,y-8,x-7+step,y+7,'#3b4650',5);line(x+6,y-8,x+7-step,y+7,'#3b4650',5);rect(x-10,y-39,20,31,n.color);rect(x-14,y-32,5,21,'#dfb28e');rect(x+9,y-32,5,21,'#dfb28e');ctx.fillStyle='#edc5a2';ctx.beginPath();ctx.arc(x,y-48,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4c3933';ctx.beginPath();ctx.arc(x,y-53,11,Math.PI,Math.PI*2);ctx.fill()}function draw(t){const dpr=Math.min(window.devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);$('staticStore').style.display='none';let scale=Math.min(w/900,h/560);ctx.translate((w-900*scale)/2,(h-560*scale)/2);ctx.scale(scale,scale);shop();customers.slice().sort((a,b)=>a.y-b.y).forEach(n=>person(n,t));if(state.worker){person({x:510+Math.sin(t)*24,y:285,color:'#168f79',id:0},t)}label('便利商店 · 營業中',26,34,23,'#23495a');label('REAL STORE SIMULATOR',27,56,13,'#4d7783')}const waypoints=[[770,505],[615,405],[530,320],[420,290],[310,300],[220,380],[600,400],[650,395],[790,515]];function spawn(){if(customers.length>=8)return;const picks=[2+Math.floor(Math.random()*4),2+Math.floor(Math.random()*4)];customers.push({x:770,y:505,target:1,stops:picks,phase:0,wait:0,id:Math.random()*20,color:['#3d84a3','#bb6e77','#68a08c','#b89556'][Math.floor(Math.random()*4)]})}function sale(){const n=customers[0];if(!n)return;let i=Math.floor(Math.random()*4);if(state.stock[i]>0){state.stock[i]--;state.cash+=goods[i][3];state.sales++;state.level=1+Math.floor(state.sales/25);$('status').textContent='🛍️ 顧客購買 '+goods[i][0]+'，收入 $'+goods[i][3];save();ui()}else{$('status').textContent='⚠️ '+goods[i][0]+' 缺貨，顧客沒有購買'}}function update(dt){clock+=dt;restock+=dt;if(clock>3){clock=0;spawn()}if(state.worker&&restock>12){restock=0;let i=state.stock.findIndex(v=>v<5);if(i>=0&&state.cash>=goods[i][2]*10){state.cash-=goods[i][2]*10;state.stock[i]+=10;save();ui();$('status').textContent='👩‍💼 員工已補貨 '+goods[i][0]}}customers.forEach(n=>{if(n.wait>0){n.wait-=dt;return}let p=waypoints[n.target];if(!p)return;let dx=p[0]-n.x,dy=p[1]-n.y,len=Math.hypot(dx,dy);if(len<3){if(n.target===7){sale();n.target=8;n.wait=1}else if(n.target===8){n.done=true}else if(n.target===1){n.target=n.stops[0]}else if(n.phase===0){n.phase=1;n.target=n.stops[1];n.wait=.9}else{n.target=6;n.wait=.8}}else{let v=Math.min(len,75*dt);n.x+=dx/len*v;n.y+=dy/len*v}});customers=customers.filter(n=>!n.done);$('count').textContent=customers.length}function ui(){$('cash').textContent='$'+state.cash.toLocaleString();$('sales').textContent=state.sales+' 件';$('level').textContent=state.level;$('shopname').textContent=state.name;$('hire').disabled=state.worker||state.cash<1500;$('hire').textContent=state.worker?'補貨員工作中':'雇用自動補貨員 $1,500';$('items').replaceChildren();goods.forEach((g,i)=>{let c=document.createElement('div');c.className='item',t=document.createElement('div');t.textContent=g[1]+' '+g[0]+'｜庫存 '+state.stock[i];let sub=document.createElement('div');sub.className='small';sub.textContent='進價 $'+g[2]+'／售價 $'+g[3];let b=document.createElement('button');b.textContent='進貨 10 件 · $'+g[2]*10;b.disabled=state.cash<g[2]*10;b.onclick=()=>{state.cash-=g[2]*10;state.stock[i]+=10;save();ui();$('status').textContent='📦 已進貨 '+g[0]};c.append(t,sub,b);$('items').append(c)})}$('hire').onclick=()=>{if(state.cash<1500||state.worker)return;state.cash-=1500;state.worker=true;save();ui()};$('rename').onclick=()=>{let n=prompt('輸入店名',state.name);if(n&&n.trim()){state.name=n.trim().slice(0,20);save();ui()}};$('reset').onclick=()=>{if(confirm('確定清除本機遊戲進度？')){localStorage.removeItem(key);location.reload()}};function tick(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw(now/1000);requestAnimationFrame(tick)}ui();requestAnimationFrame(tick)})();</script></body></html>
