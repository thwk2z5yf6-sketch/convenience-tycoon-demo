<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨｜真實商店版</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf0f3;color:#183142;font:15px system-ui,-apple-system}header{background:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0b987e}h1{font-size:19px;margin:0}.tag{font-size:11px;color:#087c69}#game{position:relative;background:linear-gradient(#9ec6db,#dae6e9);height:min(70vh,640px);min-height:350px;overflow:hidden}#staticStore{position:absolute;inset:0;width:100%;height:100%;display:block}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:transparent}#overlay{position:absolute;left:10px;top:10px;background:#fffffff0;padding:8px 10px;border-radius:12px;font-size:12px;box-shadow:0 2px 10px #0002;pointer-events:none}#hud{display:flex;gap:8px;overflow:auto;background:#fff;padding:10px}#hud span{flex:1;min-width:90px;background:#eaf5f1;padding:10px;border-radius:10px;text-align:center;font-size:13px}main{max-width:900px;margin:auto;padding:12px}.panel{background:white;padding:15px;border-radius:15px;margin-bottom:12px;box-shadow:0 3px 10px #18314210}button{border:0;background:#078e77;color:white;padding:11px 13px;border-radius:10px;font-weight:700;margin:4px;cursor:pointer}button:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{padding:10px;border:1px solid #d8e3e6;border-radius:11px}.small{font-size:12px;color:#647885}#status{color:#076c5d;font-weight:650;margin:10px 0}h2{font-size:17px;margin:0 0 10px}@media(min-width:850px){#game{max-width:1100px;margin:auto}}</style></head><body><header><div><h1>🏪 便利商店大亨</h1><div class="tag">REAL STORE · 2.5D 模擬經營</div></div><div class="small">手機試玩版</div></header><div id="hud"><span>💰 現金<br><b id="cash"></b></span><span>🛍️ 總銷售<br><b id="sales"></b></span><span>👥 店內顧客<br><b id="count"></b></span><span>⭐ 商店等級<br><b id="level"></b></span></div><div id="game"><svg id="staticStore" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="便利商店場景預覽"><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#a8d0de"/><stop offset="1" stop-color="#e2ecec"/></linearGradient></defs><rect width="900" height="560" fill="url(#bg)"/><polygon points="90,170 615,75 855,210 325,485" fill="#c5ceca" stroke="#859f9d" stroke-width="4"/><polygon points="90,170 615,75 615,54 90,148" fill="#f3f5f1"/><polygon points="615,75 855,210 855,189 615,54" fill="#e9efec"/><polygon points="92,152 616,57 852,190 852,205 616,72 92,169" fill="#087f6c"/><polygon points="92,167 616,73 852,206 852,214 616,82 92,175" fill="#ed9b4d"/><g stroke="#aebbb6" stroke-width="2"><path d="M170 155L405 446M270 135L505 420M370 116L605 385M470 96L705 330M570 82L805 267"/><path d="M120 210L645 113M155 255L685 142M190 300L725 171M225 345L765 200M260 390L805 229"/></g><g><rect x="160" y="205" width="72" height="123" rx="3" fill="#738b95"/><rect x="168" y="213" width="56" height="101" fill="#d7e6e8"/><rect x="260" y="190" width="72" height="123" rx="3" fill="#738b95"/><rect x="268" y="198" width="56" height="101" fill="#d7e6e8"/><rect x="360" y="175" width="72" height="123" rx="3" fill="#738b95"/><rect x="368" y="183" width="56" height="101" fill="#d7e6e8"/><rect x="460" y="160" width="72" height="123" rx="3" fill="#738b95"/><rect x="468" y="168" width="56" height="101" fill="#d7e6e8"/></g><g fill="#56a4c0"><path d="M174 226h13v19h-13zM194 226h13v19h-13zM274 211h13v19h-13zM294 211h13v19h-13zM374 196h13v19h-13zM394 196h13v19h-13zM474 181h13v19h-13zM494 181h13v19h-13z"/></g><g fill="#d5a464"><path d="M174 258h13v19h-13zM194 258h13v19h-13zM274 243h13v19h-13zM294 243h13v19h-13zM374 228h13v19h-13zM394 228h13v19h-13zM474 213h13v19h-13zM494 213h13v19h-13z"/></g><rect x="590" y="165" width="130" height="138" rx="5" fill="#688d9d" stroke="#fff" stroke-width="5"/><g fill="#a8d6e4" stroke="#fff" stroke-width="3"><rect x="596" y="173" width="35" height="116"/><rect x="638" y="173" width="35" height="116"/><rect x="680" y="173" width="33" height="116"/></g><rect x="555" y="355" width="174" height="75" fill="#78929a"/><polygon points="555,355 583,341 756,341 729,355" fill="#e7eeee"/><rect x="622" y="323" width="65" height="25" rx="3" fill="#344a54"/><rect x="638" y="329" width="32" height="10" fill="#81c7b4"/><g fill="#eff1ed" stroke="#859d9e" stroke-width="4"><rect x="155" y="355" width="135" height="50"/><rect x="350" y="317" width="145" height="50"/></g><g fill="#a3b9b4"><rect x="165" y="360" width="115" height="16"/><rect x="360" y="322" width="125" height="16"/></g><g><circle cx="520" cy="280" r="12" fill="#e9bd97"/><path d="M509 294h22v36h-22z" fill="#357f98"/><circle cx="682" cy="320" r="12" fill="#e9bd97"/><path d="M671 334h22v36h-22z" fill="#ca8668"/><circle cx="380" cy="405" r="12" fill="#e9bd97"/><path d="M369 419h22v36h-22z" fill="#65947b"/></g><text x="35" y="47" font-size="26" font-family="sans-serif" font-weight="bold" fill="#23485a">🏪 便利商店營業中</text><text x="35" y="78" font-size="16" font-family="sans-serif" fill="#486d79">商店營業中 · 顧客自動購物</text></svg><canvas id="scene"></canvas><div id="overlay">🏬 <b id="shopname">我的便利商店</b><br>顧客會自動進店、選購、排隊結帳</div></div><main><div id="status">商店營業中，歡迎光臨！</div><div class="panel"><h2>📦 商品進貨</h2><div class="grid" id="items"></div></div><div class="panel"><h2>👩‍💼 店務管理</h2><button id="hire">雇用自動補貨員 $1,500</button><button id="rename">更改店名</button><button id="reset">重新開始</button><p class="small">進度儲存在這台裝置的瀏覽器。這是原創 2.5D 模擬畫面，尚未支援 LINE 登入或雲端同步。</p></div></main><script>
(function(){
"use strict";
var key="real-store-25d-v2",state={cash:10000,sales:0,level:1,stock:[12,12,12,12],worker:false,name:"我的便利商店"},items=[["礦泉水","💧",10,19],["零食餅乾","🍪",22,39],["飯糰便當","🍱",38,65],["現煮咖啡","☕",27,55]];
function by(id){return document.getElementById(id)}
try{var data=JSON.parse(localStorage.getItem(key));if(data&&Array.isArray(data.stock)&&data.stock.length===4)state=data}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function say(t){by("status").textContent=t}
function render(){by("cash").textContent="$"+state.cash.toLocaleString();by("sales").textContent=state.sales+" 件";by("level").textContent=state.level;by("shopname").textContent=state.name;by("hire").disabled=state.worker||state.cash<1500;by("hire").textContent=state.worker?"補貨員工作中":"雇用自動補貨員 $1,500";var host=by("items");host.textContent="";items.forEach(function(g,i){var card=document.createElement("div");card.className="item";var title=document.createElement("div");title.textContent=g[1]+" "+g[0]+"｜庫存 "+state.stock[i];var desc=document.createElement("div");desc.className="small";desc.textContent="進價 $"+g[2]+"／售價 $"+g[3];var button=document.createElement("button");button.textContent="進貨 10 件 · $"+g[2]*10;button.disabled=state.cash<g[2]*10;button.addEventListener("click",function(){state.cash-=g[2]*10;state.stock[i]+=10;save();render();say("📦 已補貨 "+g[0])});card.appendChild(title);card.appendChild(desc);card.appendChild(button);host.appendChild(card)})}
by("hire").addEventListener("click",function(){if(state.worker||state.cash<1500)return;state.cash-=1500;state.worker=true;save();render();say("👩‍💼 補貨員已上班")});
by("rename").addEventListener("click",function(){var n=prompt("輸入店名",state.name);if(n&&n.trim()){state.name=n.trim().slice(0,20);save();render()}});
by("reset").addEventListener("click",function(){if(confirm("確定清除遊戲進度？")){localStorage.removeItem(key);location.reload()}});
var svg=by("staticStore"),people=[],colors=["#357f98","#ca8668","#65947b","#b38b57"];
function person(color){var ns="http://www.w3.org/2000/svg",g=document.createElementNS(ns,"g"),head=document.createElementNS(ns,"circle"),body=document.createElementNS(ns,"rect");head.setAttribute("cx","0");head.setAttribute("cy","-28");head.setAttribute("r","10");head.setAttribute("fill","#e9bd97");body.setAttribute("x","-10");body.setAttribute("y","-17");body.setAttribute("width","20");body.setAttribute("height","32");body.setAttribute("rx","4");body.setAttribute("fill",color);g.appendChild(body);g.appendChild(head);svg.appendChild(g);return g}
for(var i=0;i<5;i++)people.push({node:person(colors[i%4]),phase:i*1.5,stage:0});
var route=[[790,515],[710,390],[500,290],[320,300],[430,360],[615,390],[690,400],[790,515]];
function point(p){var n=Math.floor(p),f=p-n;if(n>=route.length-1)return route[route.length-1];return[route[n][0]+(route[n+1][0]-route[n][0])*f,route[n][1]+(route[n+1][1]-route[n][1])*f]}
var t=0;
function advance(){t+=.035;people.forEach(function(p,i){var progress=(t/2+p.phase)%7;var xy=point(progress);p.node.setAttribute("transform","translate("+xy[0].toFixed(1)+" "+xy[1].toFixed(1)+")")});by("count").textContent=people.length}
function sell(){var i=Math.floor(Math.random()*4);if(state.stock[i]>0){state.stock[i]--;state.cash+=items[i][3];state.sales++;state.level=1+Math.floor(state.sales/25);say("🛍️ 顧客購買 "+items[i][0]+"，收入 $"+items[i][3])}else say("⚠️ "+items[i][0]+" 已售完，請補貨");save();render()}
var restock=0;function business(){sell();restock++;if(state.worker&&restock%3===0){var i=state.stock.findIndex(function(x){return x<5});if(i>=0&&state.cash>=items[i][2]*10){state.cash-=items[i][2]*10;state.stock[i]+=10;save();render();say("👩‍💼 補貨員已補貨 "+items[i][0])}}}
var canvas=by("scene");if(canvas)canvas.style.display="none";svg.querySelector("text:last-of-type").textContent="顧客正在自動購物與結帳";
render();advance();setInterval(advance,40);setInterval(business,4500);say("✅ 商店畫面已啟動，顧客正在走動");
})();
</script></body></html>
