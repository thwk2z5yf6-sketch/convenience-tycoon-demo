<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1727;color:#f5f9ff;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:#16273c}h1{font-size:18px;margin:0}#world{height:58vh;min-height:330px;touch-action:pan-y;position:relative}canvas{display:block}#hint{position:absolute;left:10px;bottom:10px;background:#0b1930bb;padding:7px;border-radius:9px;font-size:12px;pointer-events:none}#hud{display:flex;gap:9px;overflow:auto;padding:10px;background:#16273c}#hud span{background:#263c57;padding:8px;border-radius:9px;white-space:nowrap}main{padding:10px;max-width:850px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{background:#20334d;border:1px solid #39526d;border-radius:13px;padding:12px}button{background:#4de0a6;color:#092c24;border:0;border-radius:10px;padding:10px;margin-top:8px;font-weight:750;cursor:pointer}button:disabled{opacity:.45}.sub{color:#b7c9db;font-size:12px}#status{color:#ffe19b;padding:8px}a{color:#8ee6ff}</style></head><body><header><h1>🏪 便利商店大亨 3D</h1><span class="sub">NPC 自動購物版</span></header><div id="hud"><span>💰 <b id="money"></b></span><span>🛒 銷售 <b id="sales"></b></span><span>⭐ 等級 <b id="level"></b></span><span>👥 店內顧客 <b id="customers"></b></span></div><div id="world"><div id="hint">👆 拖曳旋轉視角 · 雙指縮放 · NPC 自動走動</div></div><main><div id="status" aria-live="polite">商店營業中，等待顧客進門…</div><div class="card"><b>🧑‍💼 員工與店面</b><div><button id="hire">雇用補貨員 $1,500</button><button id="move">🧱 調整貨架位置</button></div><div class="sub" id="edithelp">按「調整貨架位置」後，點選貨架，再點地面移動。</div></div><div class="cards" id="cards"></div><p class="sub">試玩版：使用瀏覽器儲存遊戲進度；尚未提供 LINE 登入或玩家同步。3D 場景首次開啟需網路載入。</p><button id="reset">重置遊戲</button></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const products=[['瓶裝水','💧',10,17],['泡麵','🍜',25,42],['飯糰','🍙',20,35],['咖啡','☕',30,55]],key='tycoon-3d-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||null}catch{}if(!state||!Array.isArray(state.stock))state={money:10000,sales:0,level:1,stock:[8,8,8,8]};const save=()=>localStorage.setItem(key,JSON.stringify(state)),get=id=>document.getElementById(id),notify=t=>get('status').textContent=t;const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ecbe3);const camera=new THREE.PerspectiveCamera(48,1,.1,100);camera.position.set(12,14,18);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;get('world').prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=1.45;controls.minDistance=9;controls.maxDistance=31;scene.add(new THREE.HemisphereLight(0xffffff,0x5c7184,2.3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(8,16,6);sun.castShadow=true;scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}box(15,.35,13,0xe5e5d6,0,-.2,0);box(15,2,.25,0xe8f2ef,0,1,-6.5);box(.25,2,13,0xe8f2ef,-7.5,1,0);box(.25,2,13,0xe8f2ef,7.5,1,0);box(2.7,.1,2,0x9dd5b8,0,.02,6.2);box(3,1.15,1.2,0x4c9aa7,4.4,.6,4);box(1.2,.25,.7,0x263746,4.4,1.3,4);box(.7,.15,.55,0xffdb6c,4.4,1.5,4);for(let i=0;i<4;i++){let x=-5+i*3.15;const shelf=box(1.8,1.5,2.3,0xb0a0b8,x,.75,-2.1);shelves.push(shelf);for(let j=0;j<3;j++){box(1.9,.13,2.4,0x67547b,x,.4+j*.46,-2.1);for(let k=0;k<3;k++)box(.33,.25,.45,[0x56bce2,0xf7bd5e,0xd97993,0x87d8a2][i],x-.55+k*.54,.6+j*.46,-2.1)}}box(3,2,.8,0x7db9dc,5.2,1,-5.8);box(3,.3,.9,0x2b6289,5.2,2,-5.8);const npc=[];const shelves=[];const queue=[];let editing=false,selected=-1,worker=null,restockClock=0;const entrance=new THREE.Vector3(0,0,8.8),checkout=new THREE.Vector3(4.4,0,4);const destinations=[new THREE.Vector3(-5,0,-.4),new THREE.Vector3(-1.85,0,-.4),new THREE.Vector3(1.3,0,-.4),new THREE.Vector3(4.45,0,-.4)];function spawn(){if(npc.length>=8)return;const colors=[0xe89b68,0x74b6e6,0xe38eae,0x8cda9b,0xe6c46d];const group=new THREE.Group();let body=new THREE.Mesh(new THREE.CylinderGeometry(.36,.42,1.15,10),mat(colors[Math.floor(Math.random()*colors.length)]));body.position.y=.8;group.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,10),mat(0xffd2ac));head.position.y=1.62;group.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),mat(0x45362e));hair.position.y=1.83;hair.scale.y=.48;group.add(hair);group.position.copy(entrance);scene.add(group);const count=1+Math.floor(Math.random()*3);const picks=Array.from({length:count},()=>Math.floor(Math.random()*4));npc.push({group,phase:'shop',picks,idx:0,target:destinations[picks[0]].clone(),wait:0,speed:1.4+Math.random()*.5,paid:false})}function transact(n){if(n.paid)return;n.paid=true;let sold=0,revenue=0;for(const i of n.picks){if(state.stock[i]>0){state.stock[i]--;state.money+=products[i][3];state.sales++;sold++;revenue+=products[i][3]}}if(state.sales>=state.level*15)state.level++;notify(sold?'🛍️ 顧客購買 '+sold+' 件，收入 $'+revenue:'⚠️ 顧客想買的商品已售完');save();renderUI()}function updateQueues(){for(let i=0;i<queue.length;i++)queue[i].target=new THREE.Vector3(4.4,0,4.1+i*1.25)}function goQueue(n){n.phase='queue';n.wait=0;queue.push(n);updateQueues()}function leaveQueue(n){let i=queue.indexOf(n);if(i>=0)queue.splice(i,1);updateQueues();n.phase='exit';n.target=entrance.clone()}function staff(){if(!state.worker)return;if(!worker){worker=new THREE.Group();let b=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,1.2,10),mat(0x55e0c0));b.position.y=.75;worker.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),mat(0xffd4ad));h.position.y=1.6;worker.add(h);scene.add(worker)}worker.position.set(-6,0,3)}function updateStaff(dt){if(!state.worker)return;restockClock+=dt;worker.position.x=-5+Math.sin(restockClock*1.2)*2;worker.position.z=-1+Math.cos(restockClock*1.2)*1.2;if(restockClock>12){restockClock=0;let i=state.stock.findIndex(v=>v<5);if(i>=0&&state.money>=products[i][2]*10){state.money-=products[i][2]*10;state.stock[i]+=10;save();renderUI();notify('🧑‍💼 員工已自動補貨 '+products[i][0])}}}const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(!editing)return;const rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(shelves);if(hits.length){selected=shelves.indexOf(hits[0].object);notify('已選取貨架 '+(selected+1)+'，請點地面新位置');return}if(selected<0)return;const floor=new THREE.Plane(new THREE.Vector3(0,1,0),0),pos=new THREE.Vector3();if(ray.ray.intersectPlane(floor,pos)){pos.x=Math.max(-5.8,Math.min(5.8,pos.x));pos.z=Math.max(-4.8,Math.min(1.2,pos.z));shelves[selected].position.set(pos.x,.75,pos.z);destinations[selected].set(pos.x,0,pos.z+1.6);state.positions=shelves.map(x=>[x.position.x,x.position.z]);save();notify('貨架位置已保存');selected=-1}});if(Array.isArray(state.positions)&&state.positions.length===4)state.positions.forEach((p,i)=>{shelves[i].position.x=p[0];shelves[i].position.z=p[1];destinations[i].set(p[0],0,p[1]+1.6)});get('hire').onclick=()=>{if(state.worker||state.money<1500)return;state.money-=1500;state.worker=true;staff();save();renderUI();notify('補貨員已上班，每約 12 秒檢查缺貨商品')};get('move').onclick=()=>{editing=!editing;selected=-1;controls.enabled=!editing;get('move').textContent=editing?'✅ 完成擺放':'🧱 調整貨架位置';notify(editing?'點選貨架，再點地面新位置':'已退出擺放模式')};staff();function renderUI(){get('money').textContent='$'+state.money.toLocaleString();get('sales').textContent=state.sales;get('level').textContent=state.level;get('customers').textContent=npc.length;get('hire').disabled=!!state.worker||state.money<1500;get('hire').textContent=state.worker?'🧑‍💼 補貨員工作中':'雇用補貨員 $1,500';get('cards').replaceChildren();products.forEach((p,i)=>{let c=document.createElement('div');c.className='card';let t=document.createElement('div');t.textContent=p[1]+' '+p[0]+'｜庫存 '+state.stock[i];let d=document.createElement('div');d.className='sub';d.textContent='進價 $'+p[2]+' · 售價 $'+p[3];let b=document.createElement('button');b.textContent='補貨 10 件 · $'+p[2]*10;b.disabled=state.money<p[2]*10;b.onclick=()=>{state.money-=p[2]*10;state.stock[i]+=10;save();renderUI();notify('📦 '+p[0]+' 補貨成功')};c.append(t,d,b);get('cards').append(c)})}get('reset').onclick=()=>{if(confirm('確定重新開始？')){localStorage.removeItem(key);location.reload()}};function resize(){let w=get('world').clientWidth,h=get('world').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();let prev=performance.now(),elapsed=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-prev)/1000,.05);prev=now;elapsed+=dt;if(elapsed>3.5){elapsed=0;spawn()}updateStaff(dt);for(let i=npc.length-1;i>=0;i--){const n=npc[i];if(n.phase==='queue'&&queue[0]===n){n.wait+=dt;if(n.wait>2.5&&n.group.position.distanceTo(n.target)<.35){transact(n);leaveQueue(n)}}if(n.phase==='shop'&&n.wait>0){n.wait-=dt;continue}const dx=n.target.x-n.group.position.x,dz=n.target.z-n.group.position.z,dist=Math.hypot(dx,dz);if(dist<.16){if(n.phase==='shop'){n.idx++;if(n.idx>=n.picks.length)goQueue(n);else{n.target=destinations[n.picks[n.idx]].clone();n.wait=.7}}else if(n.phase==='exit'){scene.remove(n.group);npc.splice(i,1)}}else{let v=Math.min(dist,n.speed*dt);n.group.position.x+=dx/dist*v;n.group.position.z+=dz/dist*v;n.group.rotation.y=Math.atan2(dx,dz)}}controls.update();renderer.render(scene,camera);get('customers').textContent=npc.length}renderUI();requestAnimationFrame(loop)</script></body></html>
