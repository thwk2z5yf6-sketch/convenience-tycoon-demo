<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便利商店大亨 Online 試玩版</title><style>body{margin:0;background:#101b30;color:#f7fbff;font:16px system-ui}header,main{max-width:900px;margin:auto;padding:20px}h1{font-size:25px}.muted{color:#aabed8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.panel{background:#203451;border:1px solid #38516f;border-radius:16px;padding:17px;margin:12px 0}.store{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tile{background:#385774;border-radius:12px;padding:15px 3px;text-align:center;font-size:29px}.tile small{display:block;font-size:12px}button{background:#40d5a1;border:0;border-radius:10px;padding:11px;font-weight:bold;margin:5px;cursor:pointer}button:disabled{opacity:.4}.product{border-bottom:1px solid #48607b;padding:12px 0}#log{color:#ffd88c}</style><header><h1>🏪 便利商店大亨 Online</h1><div class="muted">手機可玩 · 單機試玩版（LINE 登入尚未開放）</div></header><main><div class="grid"><div class="panel">💰 現金<h2 id="money"></h2></div><div class="panel">⭐ 等級<h2 id="level"></h2></div><div class="panel">🛍️ 總銷售<h2 id="sales"></h2></div><div class="panel">🏆 經驗<h2 id="xp"></h2></div></div><div class="panel"><h2 id="shop"></h2><button id="rename">✏️ 更改店名</button><div class="store" id="store"></div><p class="muted">顧客每 3 秒自動購物，記得補貨！</p><button id="upgrade"></button><button id="reset">重新開始</button><p id="log" aria-live="polite"></p></div><div class="panel"><h2>📦 進貨中心</h2><div id="products"></div></div><div class="panel"><h2>🌐 多人遊戲</h2><p>LINE 登入、雲端存檔、好友商店及排行榜將於正式版推出。此試玩版不需登入，進度只儲存在目前瀏覽器。</p></div></main><script>const items=[['瓶裝水','💧',10,17],['泡麵','🍜',25,42],['飯糰','🍙',20,35],['咖啡','☕',30,55]],key='tycoon-demo-v1',fresh=()=>({money:10000,level:1,xp:0,sales:0,shop:'我的便利商店',stock:[4,4,4,4]});let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(key)||'null')}}catch{s=fresh()}if(!Array.isArray(s.stock)||s.stock.length!==4)s.stock=[4,4,4,4];const el=id=>document.getElementById(id),save=()=>localStorage.setItem(key,JSON.stringify(s)),msg=t=>el('log').textContent=t;function render(){el('money').textContent='$'+s.money.toLocaleString();el('level').textContent=s.level;el('sales').textContent=s.sales+' 件';el('xp').textContent=s.xp+'/'+s.level*100;el('shop').textContent='🏪 '+s.shop;el('store').replaceChildren();items.forEach((p,i)=>{let d=document.createElement('div');d.className='tile';d.textContent=p[1];let sm=document.createElement('small');sm.textContent=p[0]+' × '+s.stock[i];d.append(sm);el('store').append(d)});['🧾','🧊','🛒','🚪'].forEach(t=>{let d=document.createElement('div');d.className='tile';d.textContent=t;el('store').append(d)});el('products').replaceChildren();items.forEach((p,i)=>{let d=document.createElement('div');d.className='product';let label=document.createElement('div');label.textContent=p[1]+' '+p[0]+'｜庫存 '+s.stock[i]+'｜進價 $'+p[2]+'｜售價 $'+p[3];let b=document.createElement('button');b.textContent='進貨 10 件 · $'+p[2]*10;b.disabled=s.money<p[2]*10;b.onclick=()=>{s.money-=p[2]*10;s.stock[i]+=10;save();render();msg('已補貨 '+p[0])};d.append(label,b);el('products').append(d)});el('upgrade').textContent='🏗️ 升級商店 · $'+s.level*1500;el('upgrade').disabled=s.money<s.level*1500}function sell(){let a=items.map((_,i)=>i).filter(i=>s.stock[i]>0);if(!a.length){msg('商品售罄，請先補貨');return}let i=a[Math.floor(Math.random()*a.length)];s.stock[i]--;s.money+=items[i][3];s.sales++;s.xp+=10;let t='顧客購買 '+items[i][0]+'，收入 $'+items[i][3];if(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;t='🎉 升到 '+s.level+' 級！'}save();render();msg(t)}el('upgrade').onclick=()=>{let c=s.level*1500;if(s.money<c)return;s.money-=c;s.level++;save();render();msg('升級成功！')};el('rename').onclick=()=>{let v=prompt('輸入店名',s.shop);if(v&&v.trim()){s.shop=v.trim().slice(0,24);save();render()}};el('reset').onclick=()=>{if(confirm('確定清除進度？')){s=fresh();save();render()}};render();setInterval(sell,3000)</script></html>
